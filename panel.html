<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blender Bridge</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --line: #262c38; --text: #d7dce5;
    --muted: #8b95a7; --accent: #4C72B0; --ok: #3fb950; --bad: #f85149; --run: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 10px; position: sticky; top: 0;
           background: rgba(15,17,21,.92); backdrop-filter: blur(6px); z-index: 5; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .meta { margin-left: auto; color: var(--muted); font-size: 11px; text-align: right; }
  main { padding: 10px; display: grid; gap: 10px; }
  .job { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .job .top { display: flex; gap: 8px; align-items: center; padding: 9px 11px; border-bottom: 1px solid var(--line); }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .done { color: var(--ok); } .failed { color: var(--bad); } .running { color: var(--run); }
  .title { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .body { padding: 10px 11px; display: grid; gap: 8px; }
  .paths { font-family: Consolas, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .err { color: var(--bad); font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty code { color: var(--accent); }
  .spin { width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--run);
          border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ── 可交互预览视图器 ── */
  .viewer {
    position: relative; width: 100%; border-radius: 8px; border: 1px solid var(--line);
    background: #07090c; overflow: hidden; cursor: grab; touch-action: none;
    aspect-ratio: 4 / 3;
  }
  .viewer.dragging { cursor: grabbing; }
  .viewer img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    transform-origin: center center; pointer-events: none; user-select: none;
    transition: transform .06s linear;
  }
  .viewer.free img { transition: none; }
  .tools {
    position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px;
    background: rgba(10,13,18,.82); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px; backdrop-filter: blur(4px); opacity: .35; transition: opacity .15s;
  }
  .viewer:hover .tools { opacity: 1; }
  .tools button {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--text); cursor: pointer; font-size: 14px;
    display: grid; place-items: center; line-height: 1;
  }
  .tools button:hover { background: rgba(255,255,255,.08); border-color: var(--line); }
  .zoomtag {
    position: absolute; left: 8px; bottom: 8px; font-size: 10px; color: var(--muted);
    background: rgba(10,13,18,.78); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 7px; font-family: Consolas, monospace; opacity: 0; transition: opacity .15s;
  }
  .viewer:hover .zoomtag { opacity: 1; }
  .hint { font-size: 10px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Blender Bridge</h1>
  <span class="meta" id="meta">连接中…</span>
</header>
<main id="list"><div class="empty">正在读取任务…</div></main>
<script>
const list = document.getElementById('list');
const meta = document.getElementById('meta');

// 每个任务的视图状态：scale / tx / ty / rot，重建 DOM 后恢复
const state = new Map();
let lastSig = '';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusText = (s) => s === 'done' ? '完成' : s === 'failed' ? '失败' : '进行中';

function getState(id) {
  if (!state.has(id)) state.set(id, { scale: 1, tx: 0, ty: 0, rot: 0 });
  return state.get(id);
}

function apply(sv, img, tag) {
  img.style.transform = `translate(${sv.tx}px, ${sv.ty}px) scale(${sv.scale}) rotate(${sv.rot}deg)`;
  if (tag) tag.textContent = Math.round(sv.scale * 100) + '% · ' + Math.round(sv.rot) + '°';
}

// 给一个 .viewer 容器绑定交互
function bindViewer(container, id) {
  const img = container.querySelector('img');
  const tag = container.querySelector('.zoomtag');
  const sv = getState(id);
  apply(sv, img, tag);

  let mode = null, sx = 0, sy = 0, ox = 0, oy = 0, orot = 0, oscale = 0, cx = 0, cy = 0;

  const setScale = (next, px, py) => {
    const clamped = Math.min(20, Math.max(0.15, next));
    const k = clamped / sv.scale;
    if (px !== undefined) {
      // 以光标为中心缩放
      sv.tx = px - (px - sv.tx) * k;
      sv.ty = py - (py - sv.ty) * k;
    }
    sv.scale = clamped;
  };

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    container.classList.add('free');
    const r = container.getBoundingClientRect();
    setScale(sv.scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
    apply(sv, img, tag);
  }, { passive: false });

  container.addEventListener('mousedown', (e) => {
    e.preventDefault();
    container.classList.add('dragging', 'free');
    const r = container.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    sx = e.clientX; sy = e.clientY; ox = sv.tx; oy = sv.ty; orot = sv.rot; oscale = sv.scale;
    mode = (e.button === 2 || e.shiftKey) ? 'rotate' : 'pan';
  });

  window.addEventListener('mousemove', (e) => {
    if (!mode) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'pan') {
      sv.tx = ox + dx; sv.ty = oy + dy;
    } else {
      const a0 = Math.atan2(sy - cy, sx - cx);
      const a1 = Math.atan2(e.clientY - cy, e.clientX - cx);
      sv.rot = orot + (a1 - a0) * 180 / Math.PI;
    }
    apply(sv, img, tag);
  });

  window.addEventListener('mouseup', () => {
    if (!mode) return;
    mode = null;
    container.classList.remove('dragging');
  });

  container.addEventListener('contextmenu', (e) => e.preventDefault());
  container.addEventListener('dblclick', () => {
    Object.assign(sv, { scale: 1, tx: 0, ty: 0, rot: 0 });
    apply(sv, img, tag);
  });

  // 触屏：单指平移，双指缩放旋转
  let pts = new Map(), baseDist = 0, baseAng = 0;
  container.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      baseDist = Math.hypot(a.x - b.x, a.y - b.y);
      baseAng = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      oscale = sv.scale; orot = sv.rot;
    }
  });
  container.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      if (baseDist) sv.scale = Math.min(20, Math.max(0.15, oscale * (d / baseDist)));
      sv.rot = orot + (ang - baseAng);
      apply(sv, img, tag);
    }
  });
  const drop = (e) => { pts.delete(e.pointerId); if (pts.size < 2) baseDist = 0; };
  container.addEventListener('pointerup', drop);
  container.addEventListener('pointercancel', drop);

  // 工具条
  container.querySelectorAll('[data-act]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'in') sv.scale = Math.min(20, sv.scale * 1.25);
      if (act === 'out') sv.scale = Math.max(0.15, sv.scale / 1.25);
      if (act === 'cw') sv.rot += 15;
      if (act === 'ccw') sv.rot -= 15;
      if (act === 'fit') Object.assign(sv, { scale: 1, tx: 0, ty: 0, rot: 0 });
      apply(sv, img, tag);
    });
  });
}

function render(data) {
  const jobs = data.jobs || [];
  meta.textContent = jobs.length + ' 个任务 · ' + (data.blender || '');

  if (!jobs.length) {
    list.innerHTML = '<div class="empty">还没有建模任务。<br>在对话里说 <code>建一个…的模型</code> 即可触发。</div>';
    lastSig = '';
    return;
  }

  // 数据没变就不重建 DOM —— 否则每次刷新都会打断缩放/旋转
  const sig = jobs.map(j => j.id + '|' + j.status + '|' + (j.preview || '') + '|' + (j.objectCount || 0)).join('#');
  if (sig === lastSig) return;
  lastSig = sig;

  list.innerHTML = jobs.map(j => {
    const cls = j.status === 'done' ? 'done' : j.status === 'failed' ? 'failed' : 'running';
    const viewer = j.preview ? `<div class="viewer" data-job="${esc(j.id)}">
        <img src="/blender-bridge/preview/${encodeURIComponent(j.preview)}?t=${encodeURIComponent(j.id)}" alt="预览" draggable="false" />
        <span class="zoomtag">100% · 0°</span>
        <div class="tools">
          <button data-act="in"  title="放大">＋</button>
          <button data-act="out" title="缩小">－</button>
          <button data-act="ccw" title="逆时针旋转 15°">⟲</button>
          <button data-act="cw"  title="顺时针旋转 15°">⟳</button>
          <button data-act="fit" title="复位">⤢</button>
        </div>
      </div>` : '';
    const hint = j.preview ? '<div class="hint">滚轮缩放 · 拖拽平移 · 右键/Shift 拖拽旋转 · 双击复位</div>' : '';
    const dur = j.durationMs ? (j.durationMs / 1000).toFixed(1) + 's' : '';
    const spin = j.status === 'running' ? '<span class="spin"></span>' : '';
    const err = j.error ? `<div class="err">${esc(j.error)}</div>` : '';
    const paths = [
      j.preview ? `预览  ${esc(j.preview)}` : '',
      j.blend ? `工程  ${esc(j.blend)}` : ''
    ].filter(Boolean).join('<br>');
    return `<div class="job">
      <div class="top">
        ${spin}<span class="badge ${cls}">${statusText(j.status)}</span>
        <span class="title">${esc(j.title)}</span>
        <span class="time">${j.objectCount || 0} 对象 · ${dur}</span>
      </div>
      <div class="body">${viewer}${hint}${paths ? `<div class="paths">${paths}</div>` : ''}${err}</div>
    </div>`;
  }).join('');

  // 重建后重新绑定交互并恢复各自的缩放/旋转状态
  list.querySelectorAll('.viewer').forEach((el) => bindViewer(el, el.dataset.job));
}

async function tick() {
  try {
    const r = await fetch('/blender-bridge/jobs', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    meta.textContent = '连接失败：' + e.message;
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
