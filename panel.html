<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blender Bridge</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --line: #262c38; --text: #d7dce5;
    --muted: #8b95a7; --accent: #4C72B0; --ok: #3fb950; --bad: #f85149; --run: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 10px; position: sticky; top: 0;
           background: rgba(15,17,21,.92); backdrop-filter: blur(6px); z-index: 5; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .meta { margin-left: auto; color: var(--muted); font-size: 11px; text-align: right; }
  main { padding: 10px; display: grid; gap: 10px; }
  .job { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .job .top { display: flex; gap: 8px; align-items: center; padding: 9px 11px; border-bottom: 1px solid var(--line); }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .done { color: var(--ok); } .failed { color: var(--bad); } .running { color: var(--run); }
  .title { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .body { padding: 10px 11px; display: grid; gap: 8px; }
  .paths { font-family: Consolas, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .err { color: var(--bad); font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty code { color: var(--accent); }
  .spin { width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--run);
          border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ── 3D 视口 ── */
  .stage {
    position: relative; width: 100%; border-radius: 8px; border: 1px solid var(--line);
    background: #0b0e13; overflow: hidden; aspect-ratio: 4 / 3; touch-action: none;
  }
  .stage canvas { display: block; width: 100% !important; height: 100% !important; }
  .stage .overlay {
    position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px;
    background: rgba(10,13,18,.8); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px; backdrop-filter: blur(4px); opacity: .35; transition: opacity .15s;
  }
  .stage:hover .overlay { opacity: 1; }
  .stage .overlay button {
    min-width: 26px; height: 26px; padding: 0 6px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--text); cursor: pointer; font-size: 12px;
    display: grid; place-items: center;
  }
  .stage .overlay button:hover { background: rgba(255,255,255,.08); border-color: var(--line); }
  .stage .overlay button.on { background: rgba(76,114,176,.35); border-color: var(--accent); }
  .stage .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 11px; pointer-events: none;
  }
  .hint { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .viewer { position: relative; width: 100%; border-radius: 8px; border: 1px solid var(--line);
            background: #07090c; overflow: hidden; aspect-ratio: 4 / 3; }
  .viewer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Blender Bridge</h1>
  <span class="meta" id="meta">连接中…</span>
</header>
<main id="list"><div class="empty">正在读取任务…</div></main>

<script type="module">
const list = document.getElementById('list');
const meta = document.getElementById('meta');

let THREE = null, OrbitControls = null, GLTFLoader = null;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
} catch (e) {
  console.warn('[blender-bridge] three.js 加载失败，回退静态图:', e);
}

const viewers = new Map();
let lastSig = '';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusText = (s) => s === 'done' ? '完成' : s === 'failed' ? '失败' : '进行中';

function disposeAll() {
  for (const v of viewers.values()) { try { v.dispose(); } catch { /* ignore */ } }
  viewers.clear();
}

/* ───────── 3D 视口 ───────── */
function mount3D(stage, glbUrl) {
  const W = () => stage.clientWidth || 420;
  const H = () => stage.clientHeight || 320;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(W(), H(), false);
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e13);

  const camera = new THREE.PerspectiveCamera(45, W() / H(), 0.05, 100000);
  camera.position.set(60, 50, 70);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3340, 2.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(80, 120, 60); scene.add(key);
  const fill = new THREE.DirectionalLight(0xa9c4e6, 1.1); fill.position.set(-90, 40, -70); scene.add(fill);
  const bounce = new THREE.DirectionalLight(0xffffff, 0.7); bounce.position.set(0, -60, 0); scene.add(bounce);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.85;
  controls.zoomSpeed = 0.9;
  controls.panSpeed = 0.8;
  controls.minDistance = 0.5;
  controls.maxDistance = 100000;

  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = '加载模型…';
  stage.appendChild(loading);

  let loaded = false, disposed = false, modelRadius = 1;

  const loader = new GLTFLoader();
  loader.load(glbUrl, (gltf) => {
    if (disposed) return;
    const model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
    modelRadius = radius;

    model.position.set(-center.x, -box.min.y, -center.z);

    const grid = new THREE.GridHelper(radius * 8, 16, 0x2b3442, 0x1a2029);
    grid.position.y = 0;
    scene.add(grid);

    const dist = radius * 3.1;
    camera.position.set(dist * 0.8, radius * 1.5 + dist * 0.32, dist * 0.8);
    camera.near = Math.max(radius / 800, 0.01);
    camera.far = radius * 800;
    camera.updateProjectionMatrix();
    controls.target.set(0, radius * 0.95, 0);
    controls.maxDistance = radius * 30;
    controls.update();
    controls.saveState();

    loading.remove();
    loaded = true;
  }, undefined, (err) => {
    loading.textContent = '模型加载失败：' + (err && err.message ? err.message : err);
  });

  const bar = document.createElement('div');
  bar.className = 'overlay';
  const mk = (label, title, fn) => {
    const b = document.createElement('button');
    b.textContent = label; b.title = title;
    b.addEventListener('click', (e) => { e.stopPropagation(); fn(b); });
    bar.appendChild(b);
    return b;
  };
  mk('⤢', '复位视角（双击画布同效）', () => controls.reset());
  mk('⌂', '正视图', () => {
    camera.position.set(0, modelRadius * 0.95, modelRadius * 3.2);
    controls.target.set(0, modelRadius * 0.95, 0);
    controls.update();
  });
  let autoRotate = false;
  mk('⟳', '自动旋转', (b) => {
    autoRotate = !autoRotate;
    controls.autoRotate = autoRotate;
    controls.autoRotateSpeed = 1.6;
    b.classList.toggle('on', autoRotate);
  });
  stage.appendChild(bar);

  renderer.domElement.addEventListener('dblclick', () => controls.reset());

  let raf = 0;
  const tick = () => {
    if (disposed) return;
    raf = requestAnimationFrame(tick);
    if (loaded) controls.update();
    renderer.render(scene, camera);
  };
  tick();

  const ro = new ResizeObserver(() => {
    const w = W(), h = H();
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
  ro.observe(stage);

  return {
    dispose() {
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      controls.dispose();
      renderer.dispose();
      scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach((m) => {
            for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
            m.dispose();
          });
        }
      });
      const cv = renderer.domElement;
      if (cv && cv.parentNode) cv.parentNode.removeChild(cv);
    },
  };
}

/* ───────── 渲染 ───────── */
function render(data) {
  const jobs = data.jobs || [];
  meta.textContent = jobs.length + ' 个任务 · ' + (data.blender || '');

  if (!jobs.length) {
    disposeAll();
    list.innerHTML = '<div class="empty">还没有建模任务。<br>在对话里说 <code>建一个…的模型</code> 即可触发。</div>';
    lastSig = '';
    return;
  }

  const sig = jobs.map(j => j.id + '|' + j.status + '|' + (j.glb || j.preview || '') + '|' + (j.objectCount || 0)).join('#');
  if (sig === lastSig) return;
  lastSig = sig;

  disposeAll();

  list.innerHTML = jobs.map(j => {
    const cls = j.status === 'done' ? 'done' : j.status === 'failed' ? 'failed' : 'running';
    const use3D = !!(j.glb && THREE);
    const stage = use3D
      ? `<div class="stage" data-glb="/blender-bridge/preview/${encodeURIComponent(j.glb)}"></div>`
      : (j.preview ? `<div class="viewer"><img src="/blender-bridge/preview/${encodeURIComponent(j.preview)}" alt="预览" draggable="false" /></div>` : '');

    const hint = use3D
      ? '<div class="hint">左键拖拽环绕 · 滚轮缩放 · 右键拖拽平移 · 双击复位</div>'
      : (j.preview ? '<div class="hint">静态预览图（本次任务未生成 glTF）</div>' : '');

    const dur = j.durationMs ? (j.durationMs / 1000).toFixed(1) + 's' : '';
    const spin = j.status === 'running' ? '<span class="spin"></span>' : '';
    const err = j.error ? `<div class="err">${esc(j.error)}</div>` : '';
    const paths = [
      j.preview ? `预览  ${esc(j.preview)}` : '',
      j.glb ? `模型  ${esc(j.glb)}` : '',
      j.blend ? `工程  ${esc(j.blend)}` : ''
    ].filter(Boolean).join('<br>');

    return `<div class="job">
      <div class="top">
        ${spin}<span class="badge ${cls}">${statusText(j.status)}</span>
        <span class="title">${esc(j.title)}</span>
        <span class="time">${j.objectCount || 0} 对象 · ${dur}</span>
      </div>
      <div class="body">${stage}${hint}${paths ? `<div class="paths">${paths}</div>` : ''}${err}</div>
    </div>`;
  }).join('');

  const mounted = [];
  list.querySelectorAll('.stage[data-glb]').forEach((el) => {
    try { mounted.push(mount3D(el, el.dataset.glb)); }
    catch (e) { el.innerHTML = '<div class="loading">3D 视口初始化失败：' + esc(e.message) + '</div>'; }
  });
  mounted.forEach((v, i) => viewers.set('v' + i, v));
}

async function tick() {
  try {
    const r = await fetch('/blender-bridge/jobs', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    meta.textContent = '连接失败：' + e.message;
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
